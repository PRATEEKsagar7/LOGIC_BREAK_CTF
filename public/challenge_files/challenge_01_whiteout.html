<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Document // Logic Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    /* Core viewport */
    .viewport-canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }

    /* Target flag vector - precisely centered */
    .target-matrix {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: text;
    }

    .flag-label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #71717a;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: monospace;
    }

    #flag-cipher-core {
      font-size: 40px;
      font-weight: 900;
      color: #09090b;
      letter-spacing: 2px;
      font-family: 'Courier New', Courier, monospace;
      padding: 24px 40px;
      background: #ffffff;
      border: 3px solid #09090b;
      border-radius: 14px;
      line-height: 1.2;
      white-space: nowrap;
      /* Clean white card - no shadows that leak through edges */
    }

    /* 
      Geometric obstruction layer.
      Overlapping shape barriers with huge widths and thick borders create a seamless 100% whiteout blanket.
      Subtle border-color variations (#f9f9f9, #f5f5f5, #fafafa) create faint geometric borders visible only upon close inspection.
      Lowering the width or border-width in Inspect reveals the flag!
    */
    .obstruction-grid {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: auto;
      overflow: hidden;
    }

    .shape-barrier {
      position: absolute;
      width: 520px;
      height: 520px;
      background-color: #ffffff;
      border: 120px solid #fbfbfb;
      border-radius: 6px;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
      transition: width 0.25s ease, height 0.25s ease, border-width 0.25s ease;
    }

    .shape-barrier:nth-child(even) {
      border-color: #fafafa;
      border-radius: 24px;
    }

    .shape-barrier:nth-child(3n) {
      border-color: #f6f6f6;
      border-radius: 0;
    }

    .shape-barrier:nth-child(5n) {
      border-color: #fdfdfd;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="viewport-canvas">
    
    <!-- Hidden Flag Matrix -->
    <div class="target-matrix">
      <span class="flag-label">Flag Vector Captured</span>
      <div id="flag-cipher-core"></div>
    </div>

    <!-- Complete 100% Geometric Shield Blanket -->
    <div class="obstruction-grid" id="barrier-matrix">
      <!-- Center core coverage (guarantees zero exposed corners over the flag) -->
      <div class="shape-barrier" style="top: 50%; left: 50%; width: 900px; height: 380px; border-width: 110px; --rot: 0deg;"></div>
      <div class="shape-barrier" style="top: 50%; left: 50%; width: 800px; height: 360px; border-width: 120px; --rot: -6deg;"></div>
      <div class="shape-barrier" style="top: 50%; left: 50%; width: 840px; height: 350px; border-width: 100px; --rot: 8deg;"></div>
      <div class="shape-barrier" style="top: 50%; left: 42%; width: 620px; height: 420px; --rot: -14deg;"></div>
      <div class="shape-barrier" style="top: 50%; left: 58%; width: 620px; height: 420px; --rot: 12deg;"></div>
      
      <!-- Full viewport ambient geometric noise grid -->
      <div class="shape-barrier" style="top: 25%; left: 25%; --rot: 15deg;"></div>
      <div class="shape-barrier" style="top: 25%; left: 50%; --rot: -10deg;"></div>
      <div class="shape-barrier" style="top: 25%; left: 75%; --rot: 20deg;"></div>
      <div class="shape-barrier" style="top: 40%; left: 20%; --rot: -18deg;"></div>
      <div class="shape-barrier" style="top: 40%; left: 80%; --rot: 16deg;"></div>
      <div class="shape-barrier" style="top: 60%; left: 20%; --rot: 22deg;"></div>
      <div class="shape-barrier" style="top: 60%; left: 80%; --rot: -15deg;"></div>
      <div class="shape-barrier" style="top: 75%; left: 25%; --rot: -8deg;"></div>
      <div class="shape-barrier" style="top: 75%; left: 50%; --rot: 14deg;"></div>
      <div class="shape-barrier" style="top: 75%; left: 75%; --rot: -22deg;"></div>
      <div class="shape-barrier" style="top: 15%; left: 35%; --rot: 32deg;"></div>
      <div class="shape-barrier" style="top: 85%; left: 65%; --rot: -28deg;"></div>
    </div>

  </div>

  <script>
    // Obfuscated dynamic DOM reconstruction
    // No plain-text flag appears anywhere in the raw static source code.
    (function() {
      const _0x9b = 0x5b;
      const _0x4d = [55,52,60,50,56,24,15,29,32,40,46,57,47,55,104,4,57,107,41,63,104,41,4,44,106,63,47,51,4,46,53,54,111,40,48,104,63,38];
      
      window.addEventListener('DOMContentLoaded', function() {
        const decoded = _0x4d.map(function(b) {
          return String.fromCharCode(b ^ _0x9b);
        }).join('');
        
        const core = document.getElementById('flag-cipher-core');
        if (core) {
          core.textContent = decoded;
        }
      });
    })();
  </script>
</body>
</html>
